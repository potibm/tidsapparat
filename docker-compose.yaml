services:
  # --------------------------------------------------------
  # Traefik Reverse Proxy
  # --------------------------------------------------------
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/.certs:/certs:ro
      - ./infra/traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------
  # Identity
  # --------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    volumes:
      - ./infra/dex-config.yaml:/etc/dex/config.docker.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex-tids.rule=Host(`dex.tidsapparat.test`)"
      - "traefik.http.routers.dex-tids.entrypoints=websecure"
      - "traefik.http.routers.dex-tids.tls=true"
      - "traefik.http.services.dex-tids.loadbalancer.server.port=5556"

  # --------------------------------------------------------
  # Observability
  # --------------------------------------------------------
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observe-tids.rule=Host(`observe.tidsapparat.test`)"
      - "traefik.http.routers.observe-tids.entrypoints=websecure"
      - "traefik.http.routers.observe-tids.tls=true"
      - "traefik.http.services.observe-tids.loadbalancer.server.port=5080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml
      - ./backend/logs:/etc/app/logs:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "3217:4317" # OTLP gRPC (Needed for Go backend on host)
      - "3218:4318" # OTLP HTTP (Needed for Vite frontend on host)
    depends_on:
      - openobserve

  # --------------------------------------------------------
  # Data Stores
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tidsapparat_redis
    ports:
      - "3251:6379" # Needed for Go backend on host
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: tidsapparat_redisinsight
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_ALIAS0=Tidsapparat-Redis
      - RI_REDIS_HOST0=tidsapparat_redis
      - RI_REDIS_PORT0=6379
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-tids.rule=Host(`redis.tidsapparat.test`)"
      - "traefik.http.routers.redis-tids.entrypoints=websecure"
      - "traefik.http.routers.redis-tids.tls=true"
      - "traefik.http.services.redis-tids.loadbalancer.server.port=5540"

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: tidsapparat_garage
    ports:
      - "3250:3900" # S3 API (Needed for Go backend on host)
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=local-admin
      - GARAGE_DEFAULT_SECRET_KEY=local-super-secret
      - GARAGE_DEFAULT_BUCKET=tidsapparat-exports
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./infra/garage.toml:/etc/garage.toml:ro
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.s3-tids.rule=Host(`s3.tidsapparat.test`)"
      - "traefik.http.routers.s3-tids.entrypoints=websecure"
      - "traefik.http.routers.s3-tids.tls=true"
      - "traefik.http.services.s3-tids.loadbalancer.server.port=3900"

volumes:
  o2_data:
  redis_data:
  redisinsight_data:
  garage_meta:
  garage_data:
